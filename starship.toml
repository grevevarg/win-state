format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#ffffff)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$aws\
$azure\
$kubernetes\
$terraform\
$python\
$nodejs\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = "  "
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[aws]
symbol = "  "
style = "bg:#212736"
format = '[[ $symbol ($profile) ](fg:#769ff0 bg:#212736)]($style)'
disabled = false

[azure]
symbol = " 󰠅 "
style = "bg:#212736"
format = '[[ $symbol ($subscription) ](fg:#769ff0 bg:#212736)]($style)'
disabled = false

[kubernetes]
symbol = "☸"
style = "bg:#212736"
format = '[[ $symbol ($context) ](fg:#769ff0 bg:#212736)]($style)'
disabled = false

[terraform]
symbol = "  "
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'
disabled = false

[python]
symbol = "  "
style = "bg:#212736"
format = '[[ $symbol ($virtualenv) ($version) ](fg:#769ff0 bg:#212736)]($style)'
pyenv_version_name = false
disabled = false

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
